name: Deploy Play Worker

on:
  push:
    branches: [main]
    paths:
      - "play-worker/**"
      - ".github/workflows/deploy-play-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: play-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: play-worker/package-lock.json

      - name: Install
        run: npm install

      - name: Resolve or create D1
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST=$(npx wrangler d1 list --json)
          echo "$LIST" > /tmp/d1.json
          ID=$(node -e 'const a=require("/tmp/d1.json"); const h=(Array.isArray(a)?a:[]).find(d=>d.name==="poker-play-db"); process.stdout.write(h?(h.uuid||h.id||""):"")')
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler d1 create poker-play-db)
            echo "$OUT"
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi
          test -n "$ID"
          echo "database_id=$ID" >> "$GITHUB_OUTPUT"
          node -e '
            const fs=require("fs");
            const id=process.argv[1];
            let t=fs.readFileSync("wrangler.toml","utf8");
            t=t.replace(/database_id\s*=\s*"[^"]*"/, `database_id = "${id}"`);
            fs.writeFileSync("wrangler.toml", t);
            console.log("database_id", id);
          ' "$ID"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply poker-play-db --remote

      - name: Set JWT_SECRET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECRET="${{ secrets.PLAY_JWT_SECRET }}"
          if [ -z "$SECRET" ]; then
            SECRET=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}-poker-play-jwt" | sha256sum | awk '{print $1}')
            echo "Using derived JWT secret (optional: set PLAY_JWT_SECRET repo secret)"
          fi
          printf '%s' "$SECRET" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler deploy 2>&1)
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          echo "worker_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Update play/config.js with Worker URL
        if: steps.deploy.outputs.worker_url != ''
        working-directory: .
        run: |
          URL="${{ steps.deploy.outputs.worker_url }}"
          cat > play/config.js <<EOF
          // API base for poker-play Worker (auto-updated by deploy-play-worker workflow)
          window.PLAY_CONFIG = {
            apiBase: localStorage.getItem("PLAY_API_BASE") || "${URL}",
          };
          EOF
          # fix leading spaces from heredoc indent
          sed -i 's/^          //' play/config.js
          cat play/config.js

      - name: Commit config if changed
        if: steps.deploy.outputs.worker_url != ''
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/config.js play-worker/wrangler.toml
          if git diff --staged --quiet; then
            echo "No config changes"
          else
            git commit -m "chore: point /play at deployed Worker + D1 id"
            git push
          fi
