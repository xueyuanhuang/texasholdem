name = "poker-play"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "poker-play-db"
database_id = "41891be4-5737-420d-917d-5c5327d8fac1"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "POKER_ROOM", class_name = "PokerRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PokerRoom"]

[vars]
CORS_ORIGIN = "*"

# Set secrets via: wrangler secret put JWT_SECRET
# Optional: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
